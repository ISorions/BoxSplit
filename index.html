<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111418">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoxSplit</title>
<style>
:root{color-scheme:dark;--bg:#111418;--card:#1b2027;--text:#f1f3f5;--muted:#9aa3ad;--accent:#6ea0ff;--out:#1f2a40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--text:#f1f3f5;--muted:#9aa3ad;--accent:#6ea0ff;--out:#1f2a40}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--text:#f1f3f5;--muted:#9aa3ad;--accent:#6ea0ff;--out:#1f2a40}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.card{box-sizing:border-box;border:3px solid #172554;background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 0 0 3px var(--accent),0 10px 35px rgba(0,0,0,.5);opacity:.96}
h1{font-size:20px;margin:0 0 16px}
.credit{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;font-size:22px;padding:10px;border:1px solid var(--muted);border-radius:10px;background:transparent;color:var(--text)}
.stepper{display:flex;gap:8px}
.stepper input{text-align:center;flex:1;min-width:0}
.stepper button{width:64px;font-size:34px;font-weight:700;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation;user-select:none}
.stepper button:active{transform:scale(.95)}
.out{background:var(--out);border-radius:12px;padding:16px;margin-top:20px;text-align:center}
.row{display:flex;justify-content:space-around;gap:12px}
.big{font-size:56px;font-weight:700;color:var(--accent);line-height:1.1}
.small{font-size:14px;color:var(--muted);margin-top:6px}
.bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:blur(3px);transform:scale(1.12)}.shade{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:-1}
.clear{width:100%;margin-top:16px;padding:14px;font-size:22px;font-weight:700;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation}
.clear:active{transform:scale(.98)}
.stepper button,.clear{box-shadow:0 4px 10px rgba(0,0,0,.35)}
.stepper button:active,.clear:active{box-shadow:0 1px 3px rgba(0,0,0,.35)}

.card{box-shadow:0 0 0 3px #1e3a8a,0 4px 0 3px #172554,0 8px 0 3px #0f1f4a,0 24px 40px rgba(0,0,0,.55)}
.stepper button,.clear{box-shadow:0 6px 0 #1e3a8a,0 10px 14px rgba(0,0,0,.35);position:relative}
.stepper button:active,.clear:active{transform:translateY(5px);box-shadow:0 1px 0 #1e3a8a,0 3px 6px rgba(0,0,0,.35)}
.clear{margin-bottom:6px}
input{box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.out{box-shadow:inset 0 3px 8px rgba(0,0,0,.2)}
.big{text-shadow:0 1px 0 #1e40af,0 2px 0 #1e40af,0 3px 0 #1e3a8a,0 4px 0 #1e3a8a,0 5px 0 #172554,0 8px 10px rgba(0,0,0,.4)}
.beta{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;z-index:5}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:16px 0 0;background:transparent;cursor:pointer;touch-action:manipulation}
.slider::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#1e3a8a;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 4px 0 #1e3a8a,0 6px 10px rgba(0,0,0,.4)}
.slider::-moz-range-track{height:12px;border-radius:6px;background:#1e3a8a;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 4px 0 #1e3a8a,0 6px 10px rgba(0,0,0,.4)}
.slider{padding:0;border:none;border-radius:0;box-shadow:none;font-size:16px}
.inf{position:relative;height:46px;margin:16px 0 0;border-radius:23px;background:#1e3a8a;box-shadow:inset 0 3px 6px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.inf::before,.inf::after{position:absolute;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);font-size:16px;pointer-events:none}
.inf::before{content:"\25C0";left:16px}
.inf::after{content:"\25B6";right:16px}
.infthumb{position:absolute;top:1px;left:calc(50% - 22px);width:44px;height:44px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-sizing:border-box;box-shadow:0 4px 0 #172554,0 6px 10px rgba(0,0,0,.4);pointer-events:none}
.inf{height:14px;margin:26px 0 16px;border-radius:7px}
.inf::before{content:"";position:absolute;left:0;right:0;top:-16px;bottom:-16px;transform:none;font-size:0}
.inf::after{content:none}
.infthumb{width:30px;height:30px;top:-8px;left:calc(50% - 15px);border-width:3px;box-shadow:0 3px 0 #172554,0 5px 8px rgba(0,0,0,.4)}
.snd{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;touch-action:manipulation;box-shadow:0 4px 0 #1e3a8a,0 6px 10px rgba(0,0,0,.4)}
.snd:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a,0 2px 4px rgba(0,0,0,.4)}
.snd svg{width:26px;height:26px}
.snd .off{display:none}
.snd.muted .on{display:none}
.snd.muted .off{display:block}
.snd.muted{background:#6b7280;box-shadow:0 4px 0 #374151,0 6px 10px rgba(0,0,0,.4)}
.ytb{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;touch-action:manipulation;box-shadow:0 4px 0 #1e3a8a,0 6px 10px rgba(0,0,0,.4)}
.ytb:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a,0 2px 4px rgba(0,0,0,.4)}
.ytb svg{width:26px;height:26px}
.ytb.live{background:#16a34a;box-shadow:0 4px 0 #166534,0 6px 10px rgba(0,0,0,.4)}
.ytp{position:fixed;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(280px,calc(100vw - 24px));box-sizing:border-box;background:var(--card);color:var(--text);border:3px solid #172554;border-radius:14px;padding:10px;z-index:10;box-shadow:0 0 0 3px #1e3a8a,0 10px 30px rgba(0,0,0,.5)}
.ytp.hide{visibility:hidden;pointer-events:none}
.ytp .r{display:flex;gap:6px}
.ytp input{font-size:15px;padding:8px;min-width:0;flex:1;width:auto}
.ytp .go{border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:0 12px;cursor:pointer;touch-action:manipulation}
.ytp .stop{background:#6b7280}
.ytp .msg{font-size:12px;color:var(--muted);margin-top:6px;min-height:14px}
.ytp .frame{position:fixed;left:0;bottom:0;width:320px;height:200px;opacity:.01;pointer-events:none;z-index:-3;overflow:hidden;visibility:visible}
.ytp .frame.show{position:relative;width:100%;height:auto;aspect-ratio:16/9;opacity:1;pointer-events:auto;z-index:auto;margin-top:8px;border-radius:8px;background:#000}
.ytp .frame.empty{display:none}
.ytp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* mobile / small-screen fixes */
html{-webkit-text-size-adjust:100%}
body{box-sizing:border-box;min-height:100vh;min-height:100dvh;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.card{margin:0 auto}
@media (max-width:380px),(max-height:620px){
  body{padding:10px 10px calc(76px + env(safe-area-inset-bottom,0px))}
  .card{padding:14px;border-radius:12px}
  h1{font-size:17px;margin-bottom:10px}
  .credit{font-size:11px}
  label{margin:8px 0 3px;font-size:12px}
  input{font-size:18px;padding:7px}
  .stepper button{width:52px;font-size:28px}
  .inf{margin:20px 0 12px}
  .out{padding:10px;margin-top:12px}
  .big{font-size:40px}
  .small{font-size:12px}
  .clear{padding:10px;font-size:18px;margin-top:12px}
  .snd,.ytb{width:42px;height:42px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .snd{right:10px}.ytb{left:10px}
  .snd svg,.ytb svg{width:22px;height:22px}
  .ytp{left:10px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:calc(100vw - 20px)}
}
@media (max-width:260px){
  .stepper button{width:42px;font-size:24px}
  .big{font-size:32px}
  .row{gap:6px}
  .ytp .r{flex-wrap:wrap}
}
/* mute button inside card, top right */
.card{position:relative}
.card h1{padding-right:50px}
.card .snd{position:absolute;top:14px;right:14px;bottom:auto;left:auto;width:40px;height:40px;z-index:2}
.card .snd svg{width:22px;height:22px}
/* yt button + panel inside card */
.card .ytb{position:absolute;top:14px;right:62px;bottom:auto;left:auto;width:40px;height:40px;z-index:2}
.card .ytb svg{width:22px;height:22px}
.card .ytp{position:absolute;top:62px;left:14px;right:14px;bottom:auto;width:auto;z-index:3}
.card h1{padding-right:104px}
body{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
/* bigger sliders */
.inf{height:22px;margin:38px 0 26px;border-radius:11px}
.inf::before{top:-24px;bottom:-24px}
.infthumb{width:48px;height:48px;top:-13px;left:calc(50% - 24px);border-width:4px;box-shadow:0 4px 0 #172554,0 6px 10px rgba(0,0,0,.4)}
@media (max-width:380px),(max-height:620px){
  .inf{height:18px;margin:32px 0 20px;border-radius:9px}
  .infthumb{width:40px;height:40px;top:-11px;left:calc(50% - 20px)}
}
/* bigger credit */
.credit{font-size:16px;font-weight:700;margin-top:4px}
@media (max-width:380px),(max-height:620px){.credit{font-size:14px}}
</style>

<h1>BoxSplit <span class="credit">(Made By Darren aka ISorions)</span></h1>
<label for="pcs">Pieces to pick</label>
<div class="stepper"><button type="button" data-t="pcs" data-d="-1" aria-label="minus">&minus;</button><input id="pcs" type="number" inputmode="numeric" min="0" value="0"><button type="button" data-t="pcs" data-d="1" aria-label="plus">+</button></div>
<div class="inf" id="pcsS" data-t="pcs" data-r="1" aria-label="drag to change pcs"><div class="infthumb"></div></div>
<label for="per">Pieces per box</label>
<div class="stepper"><button type="button" data-t="per" data-d="-1" aria-label="minus">&minus;</button><input id="per" type="number" inputmode="numeric" min="0" value="0"><button type="button" data-t="per" data-d="1" aria-label="plus">+</button></div>
<div class="inf" id="perS" data-t="per" data-r="0.2" aria-label="drag to change per"><div class="infthumb"></div></div>
<div class="out">
<div class="row">
<div><div class="big" id="boxes">0</div><div>boxes</div></div>
<div><div class="big" id="loose">0</div><div>loose pcs</div></div>
</div>
<div class="small" id="detail"></div>
</div>
<button type="button" id="clear" class="clear">Clear all</button>
</div>
<script>
const $=id=>document.getElementById(id);
function calc(){
  const pcs=+$('pcs').value||0, per=+$('per').value||0;
  $('pcsS').value=pcs;$('perS').value=per;
  if(per<1){$('boxes').textContent='0';$('loose').textContent='0';$('detail').textContent=pcs>0?'Enter pieces per box':'';return}
  const full=Math.floor(pcs/per), loose=pcs%per;
  $('boxes').textContent=full;
  $('loose').textContent=loose;
  let t=loose>0?'Open 1 box for the loose pcs':'Exact, no loose pieces';
  $('detail').innerHTML=t;
}
['pcs','per'].forEach(i=>$(i).addEventListener('input',calc));
document.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{
  const el=$(b.dataset.t), min=+el.min||0;
  el.value=Math.max(min,(+el.value||0)+ +b.dataset.d);
  calc();
}));
$('clear').addEventListener('click',()=>{$('pcs').value=0;$('per').value=0;calc()});
document.querySelectorAll('.inf').forEach(el=>{
  const th=el.firstElementChild, target=$(el.dataset.t), rate=+el.dataset.r;
  let startX=0,startV=0,active=false;
  el.addEventListener('pointerdown',e=>{active=true;startX=e.clientX;startV=+target.value||0;try{el.setPointerCapture(e.pointerId)}catch(_){}th.style.transition='none';e.preventDefault()});
  el.addEventListener('pointermove',e=>{
    if(!active)return;
    const dx=e.clientX-startX, d=Math.round(dx*(0.3+Math.abs(dx)/100)*rate);
    target.value=Math.max(0,startV+d);
    const lim=el.clientWidth/2-th.offsetWidth/2;
    th.style.transform='translateX('+Math.max(-lim,Math.min(lim,dx))+'px)';
    calc();
  });
  const end=()=>{if(!active)return;active=false;th.style.transition='transform .2s';th.style.transform='translateX(0)'};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
});

let actx=null,abuf=null;
const fb=new Audio('data:audio/wav;base64,'+SND);
fb.preload='auto';
function loadAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const bin=atob(SND),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    actx.decodeAudioData(arr.buffer,b=>{abuf=b},()=>{});
  }catch(_){actx=null}
}
let muted=false;
try{muted=localStorage.getItem('pc_muted')==='1'}catch(_){}
function applyMute(){
  const b=$('snd');b.classList.toggle('muted',muted);
  b.setAttribute('aria-pressed',muted);b.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
}
$('snd').addEventListener('click',()=>{
  muted=!muted;applyMute();
  try{localStorage.setItem('pc_muted',muted?'1':'0')}catch(_){}
  if(window.ytMute)window.ytMute(muted);
  if(!muted)beep();
});
applyMute();
function beep(){
  if(muted)return;
  try{
    loadAudio();
    if(actx&&actx.state==='suspended')actx.resume();
    if(actx&&abuf){const s=actx.createBufferSource();s.buffer=abuf;s.connect(actx.destination);s.start(0);return}
  }catch(_){}
  try{fb.currentTime=0;const p=fb.play();if(p&&p.catch)p.catch(()=>{})}catch(_){}
}
document.addEventListener('pointerdown',loadAudio,{once:true});
document.addEventListener('touchstart',loadAudio,{once:true,passive:true});
document.querySelectorAll('.stepper button,#clear').forEach(b=>b.addEventListener('click',beep));
(function(){
  const btn=$('ytb'),panel=$('ytp'),inp=$('yturl'),msg=$('ytmsg'),fr=$('ytframe');
  function parse(u){
    u=(u||'').trim();if(!u)return null;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    let x;try{x=new URL(u)}catch(_){return null}
    const h=x.hostname.replace(/^www\.|^m\.|^music\./,'');
    let id=null;
    if(h==='youtu.be')id=x.pathname.slice(1).split('/')[0];
    else if(h==='youtube.com'||h==='youtube-nocookie.com'){
      if(x.pathname==='/watch')id=x.searchParams.get('v');
      else{const m=x.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/);if(m)id=m[1]}
    }else return null;
    const list=x.searchParams.get('list');
    if(id&&/^[\w-]{6,}$/.test(id))return{id:id,list:list&&/^[\w-]+$/.test(list)?list:null};
    if(list&&/^[\w-]+$/.test(list))return{id:null,list:list};
    return null;
  }
  function setM(m){
    const f=fr.querySelector('iframe');
    if(!f||!f.contentWindow)return;
    try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:m?'mute':'unMute',args:[]}),'*')}catch(_){}
  }
  window.ytMute=setM;
  function play(){
    const r=parse(inp.value);
    if(!r){msg.textContent='That doesn\u2019t look like a YouTube link';return}
    let src;
    const org=/^https?:$/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):'';
    if(r.id&&r.list)src='https://www.youtube-nocookie.com/embed/'+r.id+'?list='+r.list+'&loop=1&autoplay=1&playsinline=1&enablejsapi=1'+org;
    else if(r.id)src='https://www.youtube-nocookie.com/embed/'+r.id+'?playlist='+r.id+'&loop=1&autoplay=1&playsinline=1&enablejsapi=1'+org;
    else src='https://www.youtube-nocookie.com/embed/videoseries?list='+r.list+'&loop=1&autoplay=1&playsinline=1&enablejsapi=1'+org;
    fr.innerHTML='';
    const f=document.createElement('iframe');
    f.src=src;f.title='YouTube player';f.allow='autoplay; encrypted-media; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';f.setAttribute('allowfullscreen','');
    f.addEventListener('load',()=>{setM(muted);setTimeout(()=>setM(muted),600);setTimeout(()=>setM(muted),1800)});
    fr.appendChild(f);fr.classList.remove('empty');btn.classList.add('live');
    msg.textContent='Playing on loop';
    try{localStorage.setItem('pc_yt',inp.value.trim())}catch(_){}
  }
  function stop(){fr.innerHTML='';fr.classList.add('empty');btn.classList.remove('live');msg.textContent='Stopped'}
  btn.addEventListener('click',()=>{
    const open=panel.classList.contains('hide');
    panel.classList.toggle('hide',!open);btn.setAttribute('aria-expanded',open);
    if(!open){fr.classList.remove('show');$('ytshow').textContent='Show video'}
  });
  $('ytgo').addEventListener('click',play);
  $('ytstop').addEventListener('click',stop);
  $('ytshow').addEventListener('click',()=>{const on=fr.classList.toggle('show');$('ytshow').textContent=on?'Hide video':'Show video'});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')play()});
  try{const v=localStorage.getItem('pc_yt');if(v)inp.value=v}catch(_){}
})();
calc();
